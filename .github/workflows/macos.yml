name: macOS

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test macOS app
        run: xcodebuild test -scheme ComicViewer -destination 'platform=macOS'
