name: ComicViewer
options:
  bundleIdPrefix: com.esteban
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Local ad-hoc signing so the app launches on Apple Silicon without a team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

packages:
  Swifter:
    url: https://github.com/httpswift/swifter.git
    from: "1.5.0"
  SwiftTorrent:
    url: https://github.com/warppipe/swift-torrent.git
    revision: "79ab342c50621d69bce0d6f61228fcaf70c4ae48"

targets:
  ComicViewer:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    dependencies:
      - package: Swifter
        product: Swifter
      - package: SwiftTorrent
        product: SwiftTorrent
    frameworks:
      - WebKit
      - Network
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esteban.ComicViewer
        PRODUCT_NAME: ComicViewer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        LSApplicationCategoryType: public.app-category.photography
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - ComicViewerTests

  ComicViewerMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esteban.ComicViewerMobile
        PRODUCT_NAME: Comic Viewer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Override the macOS ad-hoc signing from the base settings — automatic signing with the
        # developer's team so device builds work from Xcode and the CLI.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: D46WN8L976
    scheme: {}

  ComicViewerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: ComicViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esteban.ComicViewerTests
        GENERATE_INFOPLIST_FILE: YES
