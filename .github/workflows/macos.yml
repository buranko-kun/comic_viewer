name: macOS

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: actions/checkout@v4

      # XcodeGen 2.46 generates project format 77, so the CI runner must use a modern Xcode.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test macOS app
        run: xcodebuild test -scheme ComicViewer -destination 'platform=macOS'
